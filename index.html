<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8d5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1b4b" />
    <meta name="theme-color" content="#e8d5f5" />
    <title>SudoDo - Task Manager</title>

    <!-- Instant theme sync to prevent any flash of unstyled content -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var colorTheme = localStorage.getItem('color_theme');
          var isMidnight = colorTheme === 'midnight' || colorTheme === 'oled';
          var isDark = false;
          if (isMidnight || theme === 'dark') {
            isDark = true;
          } else if (theme === 'light') {
            isDark = false;
          } else if (theme === 'system' || !theme) {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]:not([media])');
            if (meta) meta.setAttribute('content', '#1e1b4b');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]:not([media])');
            if (meta) meta.setAttribute('content', '#e8d5f5');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background-color: #e8d5f5;
        background: linear-gradient(135deg, #e8d5f5 0%, #d4e8ff 50%, #fde8f0 100%);
        overflow-x: hidden;
      }
      html.dark, body.dark, .dark, .dark body {
        background-color: #1e1b4b;
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      }
      #root {
        width: 100%;
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
